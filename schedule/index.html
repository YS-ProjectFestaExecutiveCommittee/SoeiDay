<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    .schedule-shell { overflow-x:auto; }
    .schedule-table { min-width:820px; display:flex; }
    .schedule-time-column { width:72px; flex:0 0 72px; }
    .schedule-grid-column { flex:1 1 auto; min-width:0; }
    .schedule-column-header { height:44px; box-sizing:border-box; }
    .schedule-time-header { border-bottom:1px solid rgba(148,163,184,.22); background:rgba(248,250,252,.72); }
    .dark .schedule-time-header { background:rgba(15,23,42,.42); }
    .schedule-time-body { position:relative; }
    .schedule-location-header { display:grid; height:44px; border-bottom:1px solid rgba(148,163,184,.22); background:rgba(248,250,252,.72); }
    .dark .schedule-location-header { background:rgba(15,23,42,.42); }
    .schedule-location-header-cell { display:flex; align-items:center; justify-content:center; min-width:0; padding:0 .55rem; border-left:1px solid rgba(148,163,184,.18); font-family:ui-sans-serif,system-ui,sans-serif; font-size:.78rem; font-weight:700; letter-spacing:.08em; color:rgb(51 65 85); text-align:center; }
    .dark .schedule-location-header-cell { color:rgb(226 232 240); }
    .schedule-grid-body { display:grid; min-width:0; }
    .schedule-location-column { position:relative; min-width:0; border-left:1px solid rgba(148,163,184,.18); }
    .schedule-grid-lines { position:absolute; inset:0; pointer-events:none; }
    .schedule-hour-line { position:absolute; left:0; right:0; border-top:1px solid rgba(148,163,184,.22); }
    .schedule-half-line { position:absolute; left:0; right:0; border-top:1px dashed rgba(148,163,184,.13); }
    .schedule-time { position:absolute; left:0; width:100%; transform:translateY(-50%); font-family:ui-sans-serif,system-ui,sans-serif; font-size:.72rem; color:rgb(100 116 139); text-align:right; padding-right:10px; }
    .schedule-event { position:absolute; border:1px solid rgba(148,163,184,.28); padding:8px 9px; border-radius:2px; cursor:pointer; overflow:hidden; box-shadow:0 8px 20px rgba(15,23,42,.08); transition:transform .2s ease, box-shadow .2s ease; }
    .schedule-event:hover { transform:translateY(-1px); box-shadow:0 12px 24px rgba(15,23,42,.13); }
    .schedule-event-lime { background:rgba(132,204,22,.10); border-color:rgba(132,204,22,.45); }
    .schedule-event-orange { background:rgba(249,115,22,.10); border-color:rgba(249,115,22,.45); }
    .dark .schedule-event-lime { background:rgba(132,204,22,.12); }
    .dark .schedule-event-orange { background:rgba(249,115,22,.12); }
    .schedule-event-title { font-weight:700; letter-spacing:.04em; line-height:1.4; font-size:.84rem; }
    .schedule-event-meta { margin-top:.2rem; font-family:ui-sans-serif,system-ui,sans-serif; font-size:.63rem; color:rgb(100 116 139); line-height:1.45; }
    .schedule-event-desc { margin-top:.3rem; font-size:.7rem; line-height:1.5; color:rgb(71 85 105); }
    .dark .schedule-event-desc { color:rgb(203 213 225); }
    .schedule-legend { display:flex; flex-wrap:wrap; gap:.65rem 1rem; }
    .schedule-legend span { display:inline-flex; align-items:center; gap:.4rem; font-family:ui-sans-serif,system-ui,sans-serif; font-size:.72rem; color:rgb(100 116 139); }
    .schedule-dot { width:8px; height:8px; border-radius:999px; display:inline-block; }
    .schedule-empty { min-height:420px; display:flex; align-items:center; justify-content:center; text-align:center; color:rgb(100 116 139); letter-spacing:.08em; }
    .modal-hidden { opacity:0; pointer-events:none; }
    .modal-visible { opacity:1; pointer-events:auto; }
    .modal-panel-hidden { transform:scale(.97); }
    .modal-panel-visible { transform:scale(1); }

    @media (max-width: 640px) {
      .schedule-table { min-width:640px; }
      .schedule-time-column { width:56px; flex:0 0 56px; }
      .schedule-column-header { height:40px; }
      .schedule-location-header { height:40px; }
      .schedule-location-header-cell { padding:0 .35rem; font-size:.67rem; letter-spacing:.04em; }
      .schedule-time { font-size:.64rem; padding-right:6px; }
      .schedule-event { padding:6px 7px; }
      .schedule-event-title { font-size:.74rem; letter-spacing:.02em; }
      .schedule-event-meta { font-size:.56rem; line-height:1.35; }
    }
  </style>
</head>

<body class="font-serif bg-brand-bgLight text-slate-900 dark:bg-brand-bgDark dark:text-slate-100 antialiased transition-colors duration-300">

  <div id="header-placeholder"></div>

  <section class="relative w-full h-[350px] md:h-[450px] overflow-hidden flex bg-slate-900">
    <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image:url('https://yokohamasoei.sakura.ne.jp/wp/wp-content/uploads/2022/09/KAT_0757-scaled.jpg?auto=format&fit=crop&w=1920&q=80');filter:grayscale(10%);"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent"></div>
    <div class="relative w-full max-w-7xl mx-auto h-full flex items-end pb-16 px-6 sm:px-12 z-10">
      <div>
        <h1 class="text-4xl md:text-5xl font-bold tracking-widest text-white mb-4" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));">
          スケジュール<span class="text-brand-lime ml-1">.</span>
        </h1>
        <p class="text-slate-300 tracking-widest font-light text-sm md:text-base">Timetable &amp; Events</p>
      </div>

  </section>

  <section class="py-16 relative bg-brand-bgLight dark:bg-brand-bgDark transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 mb-8">
      <div class="flex justify-center gap-4 border-b border-gray-200 dark:border-slate-700">
        <button id="tab-day1" class="tab-btn active px-4 sm:px-8 py-4 font-bold tracking-widest border-b-2 border-brand-orange text-brand-orange dark:border-brand-orangeDark dark:text-brand-orangeDark transition-all text-sm sm:text-base" type="button">
          <span class="num-font">1</span>日目 (<span class="num-font">10/3 Sat</span>)
        </button>
        <button id="tab-day2" class="tab-btn px-4 sm:px-8 py-4 font-bold tracking-widest border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-all text-sm sm:text-base" type="button">
          <span class="num-font">2</span>日目 (<span class="num-font">10/4 Sun</span>)
        </button>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div id="loading-indicator" class="text-center py-20 text-slate-400 font-light tracking-wider">
        <i class="fa-solid fa-spinner fa-spin mr-3"></i> スケジュール情報を読み込んでいます...

      <div id="timetable-wrapper" class="hidden schedule-shell bg-white dark:bg-slate-800 shadow-xl rounded-sm">
        <div class="schedule-table">
          <div id="time-column" class="schedule-time-column relative">
            <div class="schedule-column-header schedule-time-header" aria-hidden="true"></div>

      <div class="mt-6 flex flex-col md:flex-row justify-between items-center text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-light tracking-wider gap-4">

        <p>※各イベントをタップ/クリックで詳細を確認できます。</p>

  <section class="py-20 bg-brand-surfaceLight dark:bg-brand-surfaceDark slant-top transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
      <p class="text-sm text-slate-500 dark:text-slate-400 tracking-widest font-light mb-8">Contents</p>
      <div class="flex flex-wrap justify-center gap-6">
        <a href="https://www.soei-fes.com/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-8 py-4 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white">
          <i class="fa-solid fa-house"></i> トップページへ戻る
        </a>
        <a href="https://www.soei-fes.com/map/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-8 py-4 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white">

  <div id="footer-placeholder"></div>

  <div id="event-modal" class="modal-hidden fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 transition-opacity duration-300" aria-hidden="true">
    <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-sm" data-close-modal></div>
    <div id="event-modal-panel" class="modal-panel-hidden relative bg-white dark:bg-slate-800 w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl rounded-sm transform transition-transform duration-300">
      <button id="event-modal-close" type="button" class="sticky top-4 float-right right-4 text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 dark:bg-slate-700 z-10 m-4">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <div class="p-8 sm:p-12 clear-both">
        <div class="flex items-center gap-4 mb-4 flex-wrap">
          <span id="modal-time" class="text-brand-orange dark:text-brand-orangeDark tracking-wider text-sm font-medium font-sans"></span>
          <span id="modal-category" class="px-3 py-1 bg-gray-100 dark:bg-slate-700 text-xs tracking-widest rounded-sm text-slate-600 dark:text-slate-300"></span>
        </div>
        <h3 id="modal-title" class="text-2xl sm:text-3xl font-bold leading-relaxed mb-6 text-slate-900 dark:text-white border-b border-gray-100 dark:border-white/10 pb-6"></h3>
        <div class="space-y-4 text-slate-700 dark:text-slate-300 leading-loose tracking-wide font-light text-sm sm:text-base">
          <p id="modal-location" class="font-sans text-sm"></p>
          <p id="modal-description" class="whitespace-pre-wrap"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.soei-fes.com/javascript/base02.js"></script>
  <script src="https://www.soei-fes.com/javascript/base04.js"></script>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyA5uU-q3FEcElflECG6dc4AckxxX7iKj-s",
  authDomain: "soeiday-b3b5f.firebaseapp.com",
  projectId: "soeiday-b3b5f",
  storageBucket: "soeiday-b3b5f.firebasestorage.app",
  messagingSenderId: "911210293928",
  appId: "1:911210293928:web:8ce217bfe7d5f4d837f09d",
  measurementId: "G-1H9MSJMVQP"
};

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DAY_INFO = {
      1: { label: "1日目", date: "10/3 Sat" },
      2: { label: "2日目", date: "10/4 Sun" }
    };

    const state = { items: [], activeDay: 1 };

    const els = {
      loading: document.getElementById("loading-indicator"),
      wrapper: document.getElementById("timetable-wrapper"),
      timeColumn: document.getElementById("time-column"),
      timeBody: document.getElementById("time-body"),
      gridColumn: document.getElementById("grid-column"),
      locationHeader: document.getElementById("location-header"),
      gridBody: document.getElementById("grid-body"),
      tab1: document.getElementById("tab-day1"),
      tab2: document.getElementById("tab-day2"),
      modal: document.getElementById("event-modal"),
      modalPanel: document.getElementById("event-modal-panel"),
      modalTime: document.getElementById("modal-time"),
      modalCategory: document.getElementById("modal-category"),
      modalTitle: document.getElementById("modal-title"),
      modalLocation: document.getElementById("modal-location"),
      modalDescription: document.getElementById("modal-description")
    };

    function escapeText(value) {
      return String(value ?? "");
    }

    function timeToMinutes(value) {
      const match = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(value || ""));
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function minutesToLabel(minutes) {
      const h = Math.floor(minutes / 60).toString().padStart(2, "0");
      const m = (minutes % 60).toString().padStart(2, "0");
      return `${h}:${m}`;
    }

    function colorClass(category) {
      const text = String(category || "").toLowerCase();
      return /stage|ステージ|演目|発表/.test(text) ? "schedule-event-orange" : "schedule-event-lime";
    }

    function normalizeItem(doc) {
      const data = doc.data();
      const day = Number(data.day);
      const start = timeToMinutes(data.startTime);
      const end = timeToMinutes(data.endTime);
      if (![1, 2].includes(day) || start === null || end === null || end <= start) return null;
      return { id: doc.id, ...data, day, startMinutes: start, endMinutes: end };
    }

    function openModal(item) {
      els.modalTime.textContent = `${DAY_INFO[item.day].label} ${item.startTime}–${item.endTime}`;
      els.modalCategory.textContent = item.category || "EVENT";
      els.modalTitle.textContent = item.title || "無題のイベント";
      els.modalLocation.textContent = item.location ? `会場：${item.location}` : "";
      els.modalDescription.textContent = item.description || "詳細情報はありません。";
      els.modal.classList.remove("modal-hidden");
      els.modal.classList.add("modal-visible");
      els.modalPanel.classList.remove("modal-panel-hidden");
      els.modalPanel.classList.add("modal-panel-visible");
      els.modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("overflow-hidden");
    }

    function closeModal() {
      els.modal.classList.add("modal-hidden");
      els.modal.classList.remove("modal-visible");
      els.modalPanel.classList.add("modal-panel-hidden");
      els.modalPanel.classList.remove("modal-panel-visible");
      els.modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("overflow-hidden");
    }

    function setActiveDay(day) {
      state.activeDay = day;
      [els.tab1, els.tab2].forEach((tab, index) => {
        const active = day === index + 1;
        tab.classList.toggle("active", active);
        tab.classList.toggle("border-brand-orange", active);
        tab.classList.toggle("text-brand-orange", active);
        tab.classList.toggle("dark:border-brand-orangeDark", active);
        tab.classList.toggle("dark:text-brand-orangeDark", active);
        tab.classList.toggle("border-transparent", !active);
        tab.classList.toggle("text-slate-500", !active);
      });
      renderDay(day);
    }

    function renderDay(day) {
      const items = state.items.filter((item) => item.day === day);

      els.timeBody.innerHTML = "";
      els.locationHeader.innerHTML = "";
      els.gridBody.innerHTML = "";

      const start = 9 * 60 + 30;
      const end = 15 * 60;
      const visibleItems = items.filter((item) => item.endMinutes > start && item.startMinutes < end);

      if (!visibleItems.length) {
        const height = 420;
        els.timeBody.style.height = `${height}px`;
        els.gridBody.style.height = `${height}px`;
        const empty = document.createElement("div");
        empty.className = "schedule-empty";
        empty.textContent = "この日の9:30〜15:00のスケジュールはまだ登録されていません。";
        els.gridBody.style.gridTemplateColumns = "1fr";
        els.gridBody.appendChild(empty);
        els.wrapper.classList.remove("hidden");
        return;
      }

      const totalMinutes = end - start;
      const rowHeight = 52;
      const height = (totalMinutes / 30) * rowHeight;

      els.timeBody.style.height = `${height}px`;
      els.gridBody.style.height = `${height}px`;

      const locationMap = new Map();
      visibleItems.forEach((item) => {
        const key = String(item.location || "").trim() || "会場未設定";
        if (!locationMap.has(key)) locationMap.set(key, []);
        locationMap.get(key).push(item);
      });

      const locations = Array.from(locationMap.keys());
      els.locationHeader.style.gridTemplateColumns = `repeat(${locations.length}, minmax(0, 1fr))`;
      els.gridBody.style.gridTemplateColumns = `repeat(${locations.length}, minmax(0, 1fr))`;

      locations.forEach((location) => {
        const headerCell = document.createElement("div");
        headerCell.className = "schedule-location-header-cell";
        headerCell.textContent = location;
        headerCell.title = location;
        els.locationHeader.appendChild(headerCell);
      });

      for (let minute = start; minute <= end; minute += 30) {
        const ratio = (minute - start) / totalMinutes;
        const label = document.createElement("div");
        label.className = "schedule-time";
        label.style.top = `${ratio * 100}%`;
        label.textContent = minutesToLabel(minute);
        els.timeBody.appendChild(label);
      }

      const laneGap = 4;
      const minEventHeight = 46;

      locations.forEach((location) => {
        const column = document.createElement("div");
        column.className = "schedule-location-column";
        column.style.height = `${height}px`;
        els.gridBody.appendChild(column);

        const lines = document.createElement("div");
        lines.className = "schedule-grid-lines";
        column.appendChild(lines);

        for (let minute = start; minute <= end; minute += 30) {
          const ratio = (minute - start) / totalMinutes;
          const line = document.createElement("div");
          line.className = minute % 60 === 0 ? "schedule-hour-line" : "schedule-half-line";
          line.style.top = `${ratio * 100}%`;
          lines.appendChild(line);
        }

        const events = locationMap.get(location)
          .slice()
          .sort((a, b) => a.startMinutes - b.startMinutes || a.endMinutes - b.endMinutes || a.title.localeCompare(b.title, "ja"));

        const lanes = [];

        events.forEach((item) => {
          const visibleStart = Math.max(item.startMinutes, start);
          const visibleEnd = Math.min(item.endMinutes, end);
          const topPx = ((visibleStart - start) / totalMinutes) * height;
          const naturalHeightPx = ((visibleEnd - visibleStart) / totalMinutes) * height;
          const heightPx = Math.min(
            Math.max(minEventHeight, naturalHeightPx),
            Math.max(0, height - topPx)
          );
          const bottomPx = topPx + heightPx;

          let lane = 0;
          while (lanes[lane]?.some((existing) => existing.bottomPx + laneGap > topPx)) {
            lane += 1;
          }

          if (!lanes[lane]) lanes[lane] = [];
          lanes[lane].push({ item, topPx, bottomPx });
          item.__lane = lane;
          item.__topPx = topPx;
          item.__heightPx = heightPx;
        });

        const laneCount = Math.max(lanes.length, 1);
        const laneWidth = 100 / laneCount;

        events.forEach((item) => {
          const event = document.createElement("button");
          event.type = "button";
          event.className = `schedule-event ${colorClass(item.category)} text-left`;
          event.style.top = `${item.__topPx}px`;
          event.style.height = `${item.__heightPx}px`;
          event.style.left = `calc(${item.__lane * laneWidth}% + 6px)`;
          event.style.width = `calc(${laneWidth}% - 12px)`;
          event.innerHTML = `
            <div class="schedule-event-title">${escapeText(item.title)}</div>
            <div class="schedule-event-meta">${escapeText(item.startTime)}–${escapeText(item.endTime)}${item.location ? ` ・ ${escapeText(item.location)}` : ""}</div>
          `;
          event.addEventListener("click", () => openModal(item));
          column.appendChild(event);
        });
      });

      els.wrapper.classList.remove("hidden");
    }

    async function loadSchedule() {
      try {
        const q = query(collection(db, "schedule"), where("published", "==", true));
        const snapshot = await getDocs(q);
        state.items = snapshot.docs.map(normalizeItem).filter(Boolean);
        state.items.sort((a, b) => a.day - b.day || a.startMinutes - b.startMinutes || a.title.localeCompare(b.title, "ja"));
        els.loading.classList.add("hidden");
        setActiveDay(1);
      } catch (error) {
        console.error("スケジュール取得エラー:", error);
        els.loading.innerHTML = "スケジュールを読み込めませんでした。Firebaseの設定とFirestoreルールを確認してください。";
        els.wrapper.classList.add("hidden");
      }
    }

    els.tab1.addEventListener("click", () => setActiveDay(1));
    els.tab2.addEventListener("click", () => setActiveDay(2));
    document.getElementById("event-modal-close").addEventListener("click", closeModal);
    document.querySelector("[data-close-modal]").addEventListener("click", closeModal);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });

    loadSchedule();
  </script>
</body>
