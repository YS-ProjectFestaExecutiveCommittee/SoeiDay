<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://www.soei-fes.com/image/Favicon01.ico" />
        <title>お知らせ | 創英祭 2026</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://www.soei-fes.com/javascript/base03.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script src="https://www.soei-fes.com/javascript/base01.js"></script>
        <script src="https://www.soei-fes.com/javascript/load-components.js" defer></script>
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base01.css">
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base04.css">
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base16.css">
    </head>

    <body class="font-serif bg-brand-bgLight text-slate-900 dark:bg-brand-bgDark dark:text-slate-100 antialiased transition-colors duration-300">
        <div id="header-placeholder"></div>
        <section class="relative w-full h-[350px] md:h-[450px] overflow-hidden flex bg-slate-900">
            <div class="absolute inset-0 bg-cover bg-center opacity-60 news-hero-bg" style="filter: grayscale(10%);"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent"></div>
            <div class="relative w-full max-w-7xl mx-auto h-full flex items-end pb-16 px-6 sm:px-12 z-10">
                <div>
                    <h1 class="text-4xl md:text-5xl font-bold tracking-widest text-white mb-4" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));"> お知らせ<span class="text-brand-orange ml-1">.</span>
                    </h1>
                    <p class="text-slate-300 tracking-widest font-light text-sm md:text-base">News & Updates</p>
                </div>
            </div>
        </section>
        <main>
            <section class="py-20 relative bg-brand-bgLight dark:bg-brand-bgDark bg-pattern-dots transition-colors duration-300">
                <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div class="flex flex-col gap-3 mb-10 border-b-2 border-brand-orange dark:border-brand-orangeDark pb-4">
                        <div class="flex items-end gap-4">
                            <h2 class="text-3xl md:text-4xl font-bold tracking-widest text-slate-900 dark:text-white">最新のお知らせ</h2>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-sans tracking-wider mb-1">Latest News</span>
                        </div>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 tracking-widest font-light"> 創英祭 2026 に関する最新情報を掲載します。 </p>
                    </div>
                    <div class="bg-white/80 dark:bg-slate-800/70 border border-gray-200 dark:border-slate-700 p-4 md:p-5 mb-10 shadow-sm">
                        <div class="grid grid-cols-1 lg:grid-cols-[1fr_220px] gap-3">
                            <label class="relative block">
                                <span class="sr-only">お知らせを検索</span>
                                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input id="search-input" type="search" placeholder="タイトル・本文を検索" class="news-filter-input w-full bg-transparent border border-gray-300 dark:border-slate-600 pl-11 pr-4 py-3 text-sm tracking-wide text-slate-900 dark:text-white placeholder:text-slate-400">
                            </label>
                            <label class="relative block">
                                <span class="sr-only">カテゴリ</span>
                                <select id="category-filter" class="news-filter-select w-full bg-transparent border border-gray-300 dark:border-slate-600 px-4 py-3 text-sm tracking-wide text-slate-900 dark:text-white">
                                    <option value="all">すべてのカテゴリ</option>
                                    <option value="運営">運営</option>
                                    <option value="ステージ">ステージ</option>
                                    <option value="展示・出店">展示・出店</option>
                                    <option value="来場案内">来場案内</option>
                                    <option value="その他">その他</option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div id="status" class="text-center py-8 text-slate-400 font-light tracking-wider">
                        <i class="fa-solid fa-spinner fa-spin mr-3"></i> 最新情報を読み込んでいます
                    </div>
                    <div id="release-section" class="hidden mb-20">
                        <div class="flex items-end gap-4 mb-8 border-b-2 border-brand-orange dark:border-brand-orangeDark pb-3">
                            <h3 class="text-2xl md:text-3xl font-bold tracking-widest text-slate-900 dark:text-white">ニュースリリース</h3>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-sans tracking-wider mb-1">News Release</span>
                        </div>
                        <div id="release-list" class="space-y-5"></div>
                    </div>
                    <div id="topic-section" class="hidden">
                        <div class="flex items-end gap-4 mb-8 border-b-2 border-brand-lime dark:border-brand-limeDark pb-3">
                            <h3 class="text-2xl md:text-3xl font-bold tracking-widest text-slate-900 dark:text-white">トピック</h3>
                            <span class="text-xs text-slate-500 dark:text-slate-400 font-sans tracking-wider mb-1">Topics</span>
                        </div>
                        <div id="topic-list" class="space-y-5"></div>
                    </div>
                    <div id="empty-state" class="hidden py-16 text-center border border-dashed border-gray-300 dark:border-slate-700 bg-white/60 dark:bg-slate-800/40">
                        <i class="fa-regular fa-folder-open text-3xl text-slate-300 dark:text-slate-600 mb-4"></i>
                        <p class="text-slate-500 dark:text-slate-400 tracking-wider">条件に一致するお知らせはありません。</p>
                    </div>
                </div>
            </section>
            <section class="py-20 bg-brand-surfaceLight dark:bg-brand-surfaceDark slant-top transition-colors duration-300">
                <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
                    <p class="text-sm text-slate-500 dark:text-slate-400 tracking-widest font-light mb-8">Contents</p>
                    <div class="flex flex-wrap justify-center gap-4 md:gap-6">
                        <a href="https://www.soei-fes.com/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-7 py-3.5 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300">
                            <i class="fa-solid fa-house"></i> トップページ </a>
                        <a href="https://www.soei-fes.com/concept/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-7 py-3.5 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300">
                            <i class="fa-solid fa-link"></i> コンセプト </a>
                    </div>
                </div>
            </section>
        </main>
        <div id="footer-placeholder"></div>
        <script src="https://www.soei-fes.com/javascript/base02.js"></script>
        <script src="https://www.soei-fes.com/javascript/base04.js"></script>
        <script src="https://www.soei-fes.com/javascript/base08.js"></script>
        <script type="module" src="https://www.soei-fes.com/javascript/base19.js"></script>
    </body>

</html>
