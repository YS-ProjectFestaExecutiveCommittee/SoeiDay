<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://www.soei-fes.com/image/Favicon01.ico">
  <title>ニュース投稿 | 創英祭 2026</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.soei-fes.com/javascript/base03.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.soei-fes.com/javascript/base01.js"></script>
  <script src="https://www.soei-fes.com/javascript/load-components.js" defer></script>

  <link rel="stylesheet" href="https://www.soei-fes.com/css/base01.css">
  <link rel="stylesheet" href="https://www.soei-fes.com/css/base04.css">

  <style>
    .post-hero-title {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }

    .dark .panel {
      background: rgba(30, 41, 59, 0.92);
      border-color: rgba(255, 255, 255, 0.06);
    }

    .field-label {
      display: block;
      margin-bottom: 0.55rem;
      font-size: 0.78rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgb(51 65 85);
    }

    .dark .field-label {
      color: rgb(226 232 240);
    }

    .field {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 2px;
      background: rgba(248, 250, 252, 0.95);
      color: rgb(15 23 42);
      padding: 0.8rem 0.9rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .dark .field {
      background: rgba(15, 23, 42, 0.75);
      color: rgb(248 250 252);
      border-color: rgba(148, 163, 184, 0.3);
    }

    .field:focus {
      border-color: rgb(132 204 22);
      box-shadow: 0 0 0 3px rgba(132, 204, 22, 0.12);
    }

    .field-textarea {
      min-height: 300px;
      resize: vertical;
      line-height: 1.85;
    }

    .radio-card {
      display: block;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.38);
      padding: 1rem;
      transition: 0.2s ease;
    }

    .radio-card:hover {
      border-color: rgba(132, 204, 22, 0.7);
    }

    .radio-card.active {
      border-color: rgb(132 204 22);
      box-shadow: inset 0 0 0 1px rgb(132 204 22);
      background: rgba(132, 204, 22, 0.05);
    }

    .status-message {
      min-height: 1.5rem;
      font-size: 0.86rem;
      line-height: 1.7;
    }

    .is-hidden {
      display: none !important;
    }
  </style>
</head>

<body class="font-serif bg-brand-bgLight text-slate-900 dark:bg-brand-bgDark dark:text-slate-100 antialiased transition-colors duration-300">
  <div id="header-placeholder"></div>

  <section class="relative w-full h-[300px] md:h-[390px] overflow-hidden flex bg-slate-900">
    <div
      class="absolute inset-0 bg-cover bg-center opacity-55"
      style="background-image: url('https://yokohamasoei.sakura.ne.jp/wp/wp-content/uploads/2022/09/IMG_0529-scaled.jpg?auto=format&fit=crop&w=1920&q=80'); filter: grayscale(10%);"
    ></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/65 to-transparent"></div>

    <div class="relative w-full max-w-7xl mx-auto h-full flex items-end pb-12 px-6 sm:px-12 z-10">
      <div>
        <p class="text-xs md:text-sm font-sans tracking-[0.28em] text-brand-orange dark:text-brand-orangeDark mb-4">
          NEWS ADMINISTRATION
        </p>
        <h1 class="post-hero-title text-4xl md:text-5xl font-bold tracking-[0.12em] text-white mb-3">
          ニュース投稿
        </h1>
        <p class="text-slate-300 tracking-widest font-light text-sm md:text-base">
          Firebase認証ユーザー専用
        </p>
      </div>
    </div>
  </section>

  <main class="py-20 md:py-24 bg-brand-surfaceLight dark:bg-brand-surfaceDark slant-top transition-colors duration-300">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

      <!-- 未認証時 -->
      <section id="login-panel" class="panel p-7 sm:p-10 md:p-12">
        <div class="mb-9 border-b border-slate-200 dark:border-white/10 pb-5">
          <p class="text-xs font-sans font-bold tracking-[0.18em] text-brand-orange dark:text-brand-orangeDark mb-3">
            AUTHENTICATION
          </p>
          <h2 class="text-2xl md:text-3xl font-bold tracking-widest text-slate-900 dark:text-white">
            ログイン
          </h2>
          <p class="text-sm text-slate-600 dark:text-slate-300 mt-4 leading-relaxed">
            Firebase Authenticationに事前登録されたユーザーのみ利用できます。<br>
            このページから新しいメールアドレスを登録する機能はありません。
          </p>
        </div>

        <form id="login-form" class="space-y-6" novalidate>
          <div>
            <label class="field-label" for="login-email">メールアドレス</label>
            <input
              id="login-email"
              class="field"
              type="email"
              autocomplete="username"
              inputmode="email"
              required
              placeholder="example@example.com"
            >
          </div>

          <div>
            <label class="field-label" for="login-password">パスワード</label>
            <input
              id="login-password"
              class="field"
              type="password"
              autocomplete="current-password"
              required
              placeholder="パスワード"
            >
          </div>

          <div class="flex flex-col sm:flex-row gap-3">
            <button
              id="login-button"
              type="submit"
              class="inline-flex items-center justify-center gap-3 px-7 py-3.5 border border-slate-900 dark:border-white bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:opacity-85 transition tracking-widest text-sm font-sans"
            >
              <i class="fa-solid fa-right-to-bracket"></i>
              ログイン
            </button>

            <button
              id="reset-button"
              type="button"
              class="inline-flex items-center justify-center gap-3 px-7 py-3.5 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-slate-900/50 transition tracking-widest text-sm font-sans"
            >
              <i class="fa-regular fa-envelope"></i>
              パスワード再設定
            </button>
          </div>

          <p id="login-message" class="status-message text-slate-500 dark:text-slate-400" aria-live="polite"></p>
        </form>
      </section>

      <!-- 認証済み -->
      <section id="post-panel" class="panel p-7 sm:p-10 md:p-12 is-hidden">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-5 mb-9 border-b border-slate-200 dark:border-white/10 pb-5">
          <div>
            <p class="text-xs font-sans font-bold tracking-[0.18em] text-brand-lime dark:text-brand-limeDark mb-3">
              POST
            </p>
            <h2 class="text-2xl md:text-3xl font-bold tracking-widest text-slate-900 dark:text-white">
              新しい記事を投稿
            </h2>
            <p id="current-user" class="text-xs text-slate-500 dark:text-slate-400 font-sans mt-3"></p>
          </div>

          <button
            id="logout-button"
            type="button"
            class="self-start md:self-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-slate-900/50 transition tracking-widest text-xs font-sans"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            ログアウト
          </button>
        </div>

        <form id="post-form" class="space-y-7" novalidate>
          <div>
            <span class="field-label">属性</span>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label class="radio-card active" data-category-card>
                <input type="radio" name="post-type" value="news_release" checked class="sr-only">
                <span class="flex items-start gap-4">
                  <span class="mt-1 h-3.5 w-3.5 rounded-full border border-brand-lime bg-brand-lime shrink-0"></span>
                  <span>
                    <span class="block text-base font-bold tracking-widest text-slate-900 dark:text-white">
                      ニュースリリース
                    </span>
                    <span class="block text-xs leading-relaxed text-slate-500 dark:text-slate-400 mt-2 font-sans">
                      公式発表・重要なお知らせ
                    </span>
                  </span>
                </span>
              </label>

              <label class="radio-card" data-category-card>
                <input type="radio" name="post-type" value="topic" class="sr-only">
                <span class="flex items-start gap-4">
                  <span class="mt-1 h-3.5 w-3.5 rounded-full border border-slate-300 dark:border-slate-600 shrink-0"></span>
                  <span>
                    <span class="block text-base font-bold tracking-widest text-slate-900 dark:text-white">
                      トピック
                    </span>
                    <span class="block text-xs leading-relaxed text-slate-500 dark:text-slate-400 mt-2 font-sans">
                      実行委員会からの話題・紹介
                    </span>
                  </span>
                </span>
              </label>
            </div>
          </div>

          <div>
            <label class="field-label" for="post-title">タイトル</label>
            <input
              id="post-title"
              class="field"
              type="text"
              maxlength="120"
              required
              placeholder="記事タイトルを入力してください"
            >
          </div>

          <div>
            <label class="field-label" for="post-content">本文</label>
            <textarea
              id="post-content"
              class="field field-textarea"
              maxlength="10000"
              required
              placeholder="本文を入力してください"
            ></textarea>
          </div>

          <div class="border-t border-slate-200 dark:border-white/10 pt-7">
            <button
              id="post-button"
              type="submit"
              class="inline-flex w-full sm:w-auto items-center justify-center gap-3 px-9 py-4 border border-slate-900 dark:border-white bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:opacity-85 transition tracking-widest text-sm font-sans"
            >
              <i class="fa-solid fa-paper-plane"></i>
              投稿する
            </button>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-4 leading-relaxed font-sans">
              投稿した記事はFirestoreに保存され、公開ページに即時反映されます。
            </p>
          </div>

          <p id="post-message" class="status-message" aria-live="polite"></p>
        </form>
      </section>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://www.soei-fes.com/javascript/base02.js"></script>
  <script src="https://www.soei-fes.com/javascript/base04.js"></script>
  <script src="https://www.soei-fes.com/javascript/base08.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      sendPasswordResetEmail,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      addDoc,
      collection,
      getFirestore,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyA5uU-q3FEcElflECG6dc4AckxxX7iKj-s",
  authDomain: "soeiday-b3b5f.firebaseapp.com",
  projectId: "soeiday-b3b5f",
  storageBucket: "soeiday-b3b5f.firebasestorage.app",
  messagingSenderId: "911210293928",
  appId: "1:911210293928:web:8ce217bfe7d5f4d837f09d",
  measurementId: "G-1H9MSJMVQP"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginPanel = document.getElementById("login-panel");
    const postPanel = document.getElementById("post-panel");

    const loginForm = document.getElementById("login-form");
    const loginEmail = document.getElementById("login-email");
    const loginPassword = document.getElementById("login-password");
    const loginButton = document.getElementById("login-button");
    const resetButton = document.getElementById("reset-button");
    const loginMessage = document.getElementById("login-message");

    const postForm = document.getElementById("post-form");
    const postTitle = document.getElementById("post-title");
    const postContent = document.getElementById("post-content");
    const postButton = document.getElementById("post-button");
    const postMessage = document.getElementById("post-message");
    const currentUserText = document.getElementById("current-user");
    const logoutButton = document.getElementById("logout-button");

    const categoryCards = document.querySelectorAll("[data-category-card]");

    function setButtonLoading(button, loading, loadingText, normalText, iconClass) {
      button.disabled = loading;
      button.innerHTML = loading
        ? `<i class="fa-solid fa-spinner fa-spin"></i>${loadingText}`
        : `<i class="fa-solid ${iconClass}"></i>${normalText}`;
      button.classList.toggle("opacity-60", loading);
      button.classList.toggle("cursor-not-allowed", loading);
    }

    function getFirebaseErrorMessage(error) {
      const code = error?.code || "";

      const map = {
        "auth/invalid-credential": "メールアドレスまたはパスワードが正しくありません。",
        "auth/invalid-email": "メールアドレスの形式を確認してください。",
        "auth/too-many-requests": "試行回数が多いため、一時的にログインを制限しています。時間を置いて再度お試しください。",
        "auth/user-disabled": "このユーザーは無効化されています。",
        "auth/network-request-failed": "ネットワーク接続を確認してください。",
        "auth/missing-password": "パスワードを入力してください。"
      };

      return map[code] || "処理に失敗しました。Firebase Consoleの設定も確認してください。";
    }

    function setLoginMessage(message, isError = false) {
      loginMessage.textContent = message;
      loginMessage.className = `status-message ${isError ? "text-red-600 dark:text-red-400" : "text-slate-500 dark:text-slate-400"}`;
    }

    function setPostMessage(message, isError = false) {
      postMessage.textContent = message;
      postMessage.className = `status-message ${isError ? "text-red-600 dark:text-red-400" : "text-brand-lime dark:text-brand-limeDark"}`;
    }

    function updateCategoryCards() {
      categoryCards.forEach((card) => {
        const radio = card.querySelector('input[type="radio"]');
        const indicator = card.querySelector("span > span");

        card.classList.toggle("active", radio.checked);

        if (radio.checked) {
          indicator.className = "mt-1 h-3.5 w-3.5 rounded-full border border-brand-lime bg-brand-lime shrink-0";
        } else {
          indicator.className = "mt-1 h-3.5 w-3.5 rounded-full border border-slate-300 dark:border-slate-600 shrink-0";
        }
      });
    }

    categoryCards.forEach((card) => {
      card.addEventListener("click", () => {
        const radio = card.querySelector('input[type="radio"]');
        radio.checked = true;
        updateCategoryCards();
      });
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setLoginMessage("");

      if (!loginForm.reportValidity()) return;

      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      setButtonLoading(loginButton, true, "ログイン中…", "ログイン", "right-to-bracket");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginPassword.value = "";
      } catch (error) {
        console.error(error);
        setLoginMessage(getFirebaseErrorMessage(error), true);
      } finally {
        setButtonLoading(loginButton, false, "", "ログイン", "right-to-bracket");
      }
    });

    resetButton.addEventListener("click", async () => {
      setLoginMessage("");

      const email = loginEmail.value.trim();

      if (!email) {
        setLoginMessage("パスワード再設定メールを送るメールアドレスを入力してください。", true);
        loginEmail.focus();
        return;
      }

      if (!loginEmail.checkValidity()) {
        setLoginMessage("メールアドレスの形式を確認してください。", true);
        loginEmail.focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        setLoginMessage("パスワード再設定メールを送信しました。受信トレイをご確認ください。");
      } catch (error) {
        console.error(error);
        setLoginMessage("パスワード再設定メールの送信に失敗しました。登録済みアドレスか確認してください。", true);
      }
    });

    postForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setPostMessage("");

      const user = auth.currentUser;

      if (!user) {
        setPostMessage("認証状態を確認できません。もう一度ログインしてください。", true);
        loginPanel.classList.remove("is-hidden");
        postPanel.classList.add("is-hidden");
        return;
      }

      if (!postForm.reportValidity()) return;

      const type = document.querySelector('input[name="post-type"]:checked')?.value;
      const title = postTitle.value.trim();
      const content = postContent.value.trim();

      if (!type || !title || !content) {
        setPostMessage("属性・タイトル・本文をすべて入力してください。", true);
        return;
      }

      setButtonLoading(postButton, true, "投稿中…", "投稿する", "paper-plane");

      try {
        await addDoc(collection(db, "news"), {
          type,
          title,
          content,
          published: true,
          createdAt: serverTimestamp(),
          authorUid: user.uid
        });

        postForm.reset();
        document.querySelector('input[name="post-type"][value="news_release"]').checked = true;
        updateCategoryCards();

        setPostMessage("投稿しました。公開ページに反映されます。");
      } catch (error) {
        console.error(error);
        setPostMessage("投稿に失敗しました。FirestoreのセキュリティルールとFirebase設定を確認してください。", true);
      } finally {
        setButtonLoading(postButton, false, "", "投稿する", "paper-plane");
      }
    });

    logoutButton.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error(error);
        setPostMessage("ログアウトに失敗しました。", true);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginPanel.classList.add("is-hidden");
        postPanel.classList.remove("is-hidden");
        currentUserText.textContent = `ログイン中：${user.email || "認証済みユーザー"}`;
        setLoginMessage("");
      } else {
        loginPanel.classList.remove("is-hidden");
        postPanel.classList.add("is-hidden");
        currentUserText.textContent = "";
      }
    });

    updateCategoryCards();
  </script>
</body>
</html>
