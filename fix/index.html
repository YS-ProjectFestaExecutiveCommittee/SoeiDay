<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://www.soei-fes.com/image/Favicon01.ico" />
        <title>工事中 | 創英祭 2026</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://www.soei-fes.com/javascript/base03.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script src="https://www.soei-fes.com/javascript/base01.js"></script>
        <script src="https://www.soei-fes.com/javascript/load-components.js" defer></script>
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base01.css">
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base02.css">
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base04.css">
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base05.css">
        <link rel="stylesheet" href="https://www.soei-fes.com/css/base17.css">
    </head>

    <body class="font-serif bg-brand-bgLight text-slate-900 dark:bg-brand-bgDark dark:text-slate-100 antialiased transition-colors duration-300">
        <div id="header-placeholder"></div>
        <section class="relative w-full h-[350px] md:h-[450px] overflow-hidden flex bg-slate-900">
            <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image:url('https://yokohamasoei.sakura.ne.jp/wp/wp-content/uploads/2022/09/KAT_0757-scaled.jpg?auto=format&fit=crop&w=1920&q=80');filter:grayscale(10%);"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/65 to-transparent"></div>
            <div class="relative w-full max-w-7xl mx-auto h-full flex items-end pb-16 px-6 sm:px-12 z-10">
                <div>
                    <h1 class="text-4xl md:text-5xl font-bold tracking-widest text-white mb-4" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));"> 工事中<span class="text-brand-orange ml-1">.</span>
                    </h1>
                    <p class="text-slate-300 tracking-widest font-light text-sm md:text-base"> Under Construction </p>
                </div>
            </div>
        </section>
        <main>
            <section class="py-24 relative bg-brand-bgLight dark:bg-brand-bgDark bg-pattern-dots transition-colors duration-300">
                <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div class="construction-panel px-7 py-14 sm:px-12 sm:py-16 text-center">
                        <div class="construction-mark" aria-hidden="true">
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <p class="text-xs sm:text-sm font-sans font-bold tracking-[0.25em] text-brand-orange dark:text-brand-orangeDark mb-4"> UNDER CONSTRUCTION </p>
                        <h2 class="text-3xl md:text-4xl font-bold tracking-[0.12em] text-slate-900 dark:text-white"> ただいま準備中です </h2>
                        <p class="mt-8 text-base md:text-lg leading-loose tracking-wide text-slate-700 dark:text-slate-300 font-light"> このページは現在準備を進めています。<br> 公開まで、もうしばらくお待ちください。 </p>
                        <div class="mt-10 pt-7 border-t border-slate-200 dark:border-white/10">
                            <p class="text-sm text-slate-500 dark:text-slate-400 tracking-widest font-light"> 創英祭 2026 </p>
                            <p class="mt-2 text-xs text-slate-400 dark:text-slate-500 font-sans tracking-[0.18em]"> Yokohama Soei School Festival </p>
                        </div>
                    </div>
                    <section class="mini-game mt-12 p-6 sm:p-8">
                        <div class="text-center">
                            <p class="text-xs sm:text-sm font-sans font-bold tracking-[0.2em] text-brand-lime dark:text-brand-limeDark mb-3"> MINI GAME </p>
                            <h3 class="text-2xl md:text-3xl font-bold tracking-[0.12em] text-slate-900 dark:text-white"> 「繋」を探せ！ </h3>
                            <p class="mt-4 text-sm md:text-base leading-relaxed tracking-wide text-slate-600 dark:text-slate-300 font-light"> 15秒間で「繋」のマスをできるだけたくさん見つけてください。<br class="hidden sm:block"> 工事中のページですが、ここだけは準備万端です。 </p>
                        </div>
                        <div class="mt-7 flex flex-wrap justify-center items-center gap-5 font-sans text-xs sm:text-sm tracking-wider text-slate-500 dark:text-slate-400">
                            <span>TIME <strong id="game-time" class="text-slate-900 dark:text-white">15</strong></span>
                            <span>/</span>
                            <span>SCORE <strong id="game-score" class="text-slate-900 dark:text-white">0</strong></span>
                            <span>/</span>
                            <span>BEST <strong id="game-best" class="text-brand-orange dark:text-brand-orangeDark">0</strong></span>
                        </div>
                        <div id="game-message" class="mt-5 min-h-[1.5rem] text-center text-xs sm:text-sm tracking-wider text-slate-500 dark:text-slate-400 font-sans" aria-live="polite"> スタートボタンを押してゲーム開始 </div>
                        <div id="mini-game-grid" class="mini-game-grid mt-5" aria-label="ミニゲームのマス目"></div>
                        <div class="mt-6 flex justify-center">
                            <button id="game-start" type="button" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-7 py-3 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white">
                                <i class="fa-solid fa-play"></i> スタート </button>
                        </div>
                    </section>
                    <div class="mt-12 flex justify-center">
                        <a href="https://www.soei-fes.com/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-8 py-4 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white">
                            <i class="fa-solid fa-house"></i> トップページへ戻る </a>
                    </div>
                </div>
            </section>
        </main>
        <div id="footer-placeholder"></div>
        <script src="https://www.soei-fes.com/javascript/base20.js"></script>
        <script src="https://www.soei-fes.com/javascript/base02.js"></script>
        <script src="https://www.soei-fes.com/javascript/base04.js"></script>
    </body>

</html>
