<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://www.soei-fes.com/image/Favicon01.ico">
  <title>出店案内 | 創英祭 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.soei-fes.com/javascript/base03.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.soei-fes.com/javascript/base01.js"></script>
  <script src="https://www.soei-fes.com/javascript/load-components.js" defer></script>
  <link rel="stylesheet" href="https://www.soei-fes.com/css/base01.css">
  <link rel="stylesheet" href="https://www.soei-fes.com/css/base02.css">
  <link rel="stylesheet" href="https://www.soei-fes.com/css/base07.css">
  <style>
    .booth-hero-title { text-shadow: 0 2px 8px rgba(0,0,0,.48); }
    .booth-card { position:relative; }
    .booth-card::after { content:""; position:absolute; inset:0; border:1px solid transparent; pointer-events:none; transition:border-color .25s; }
    .booth-card:hover::after { border-color:rgba(249,115,22,.55); }
    .booth-detail-image-wrap { background:linear-gradient(135deg,rgba(248,250,252,.95),rgba(226,232,240,.55)); }
    .dark .booth-detail-image-wrap { background:linear-gradient(135deg,rgba(15,23,42,.96),rgba(30,41,59,.8)); }
    .is-hidden { display:none !important; }
  </style>
</head>
<body class="font-serif bg-brand-bgLight text-slate-900 dark:bg-brand-bgDark dark:text-slate-100 antialiased transition-colors duration-300">
  <div id="header-placeholder"></div>

  <section class="relative w-full h-[350px] md:h-[450px] overflow-hidden flex bg-slate-900">
    <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image:url('https://yokohamasoei.sakura.ne.jp/wp/wp-content/uploads/2022/09/IMG_0662-scaled.jpg?auto=format&fit=crop&w=1920&q=80');filter:grayscale(10%);"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent"></div>
    <div class="relative w-full max-w-7xl mx-auto h-full flex items-end pb-16 px-6 sm:px-12 z-10">
      <div>
        <h1 class="booth-hero-title text-4xl md:text-5xl font-bold tracking-widest text-white mb-4">出店案内<span class="text-brand-lime ml-1">.</span></h1>
        <p class="text-slate-300 tracking-widest font-light text-sm md:text-base">Booths & Exhibitions</p>
      </div>
    </div>
  </section>

  <main class="py-20 relative bg-brand-bgLight dark:bg-brand-bgDark transition-colors duration-300 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="mb-12 flex justify-between items-end border-b border-gray-200 dark:border-slate-700 pb-4">
        <div>
          <h2 class="text-2xl font-bold tracking-widest text-slate-900 dark:text-white">模擬店・展示一覧</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 tracking-widest font-light">フロアごとに各団体の企画をご紹介します。</p>
        </div>
      </div>

      <div id="map-loading" class="text-center py-20 text-slate-400 font-light tracking-wider">
        <i class="fa-solid fa-spinner fa-spin mr-3"></i> 出店情報を読み込んでいます...
      </div>

      <div id="booth-list-view">
        <div id="booths-container" class="space-y-20"></div>
      </div>

      <div id="booth-detail-view" class="hidden"></div>
    </div>
  </main>

  <section class="py-20 bg-brand-surfaceLight dark:bg-brand-surfaceDark slant-top transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
      <p class="text-sm text-slate-500 dark:text-slate-400 tracking-widest font-light mb-8">Contents</p>
      <div class="flex flex-wrap justify-center gap-6">
        <a href="https://www.soei-fes.com/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-8 py-4 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white"><i class="fa-solid fa-house"></i>トップページへ戻る</a>
        <a href="https://www.soei-fes.com/schedule/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-8 py-4 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white"><i class="fa-regular fa-calendar"></i>スケジュール</a>
        <a href="https://www.soei-fes.com/map/" class="inline-flex items-center gap-3 border border-slate-900 dark:border-white px-8 py-4 tracking-widest text-sm hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors duration-300 text-slate-900 dark:text-white"><i class="fa-solid fa-map-location-dot"></i>会場マップ</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://www.soei-fes.com/javascript/base02.js"></script>
  <script src="https://www.soei-fes.com/javascript/base04.js"></script>
  <script type="module" src="https://www.soei-fes.com/javascript/base21.js"></script>
</body>
</html>
